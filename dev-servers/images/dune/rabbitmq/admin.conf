# ADMIN broker (director <-> text-router <-> gateway control plane). Plain AMQP,
# never published on the host. See game.conf for why `internal` leads the chain.
auth_backends.1 = internal
auth_backends.2 = cache
auth_cache.cached_backend = http
auth_cache.cache_ttl = 5000

auth_http.http_method = post
auth_http.user_path = http://text-router:8080/v0/auth/user
auth_http.vhost_path = http://text-router:8080/v0/auth/vhost
auth_http.resource_path = http://text-router:8080/v0/auth/resource
auth_http.topic_path = http://text-router:8080/v0/auth/topic

loopback_users.guest = true

listeners.tcp.default = 5672
management.tcp.port = 15672
log.console.level = info
