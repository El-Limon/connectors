# GAME broker (the one the map process, the clients and our sidecar talk to).
# Dropped into /etc/rabbitmq/conf.d/ next to Funcom's 10-defaults.conf.
#
# Auth chain — the one place we deliberately differ from Funcom:
#   Funcom run `auth_backends.1 = cache` ONLY, i.e. every login is resolved by the
#   HTTP backend, which is the text-router (`/v0/auth/{user,vhost,resource,topic}` on
#   :8080 — there is no separate "rmq-auth-shim" in their design). text-router only
#   knows the service accounts it mints itself and the 16-hex FLS player ids, so an
#   account we create locally could never log in, and `rabbitmqctl add_user` would be
#   a no-op as far as authentication is concerned.
#   We put `internal` FIRST. RabbitMQ walks the chain until one backend allows, so
#   the game's own accounts still resolve through the HTTP backend exactly as before,
#   and in addition a user we create with `rabbitmqctl add_user` works. That is what
#   makes DUNE_GM_PUBLISHER=amqp possible: the broker checks the AMQP `user_id`
#   property against the authenticated user, and the game only accepts server commands
#   from sender id `fls`.
auth_backends.1 = internal
auth_backends.2 = cache
auth_cache.cached_backend = http
auth_cache.cache_ttl = 5000

auth_http.http_method = post
auth_http.user_path = http://text-router:8080/v0/auth/user
auth_http.vhost_path = http://text-router:8080/v0/auth/vhost
auth_http.resource_path = http://text-router:8080/v0/auth/resource
auth_http.topic_path = http://text-router:8080/v0/auth/topic

# Enabling the internal backend also makes the default guest/guest account usable.
# This listener is published on the host, so keep guest loopback-only; the rig's
# provisioning step deletes it outright.
loopback_users.guest = true

# TLS only, on 5672 — that is what the game expects with -RMQGameTlsEnabled=true and
# it is why the published host port is 31982/tcp. The certificate is self-signed and
# minted by dev-servers/scripts/install.sh; the shipped /etc/rabbitmq/*.pem triple is
# a Funcom test cert for *.funcom.com that EXPIRED in 2022.
listeners.tcp = none
listeners.ssl.default = 5672
ssl_options.cacertfile = /etc/rabbitmq/takaro-tls/ca.crt
ssl_options.certfile = /etc/rabbitmq/takaro-tls/server.crt
ssl_options.keyfile = /etc/rabbitmq/takaro-tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

management.tcp.port = 15672
log.console.level = info
