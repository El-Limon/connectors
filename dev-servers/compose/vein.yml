# VEIN — TAKARO DEV RIG (disposable).
#
# Steam app 2131400, Linux native dedicated server, launched as
#   Vein/Binaries/Linux/VeinServer-Linux-Test -Port=7777 -QueryPort=27015 -log
# Ready marker in the log: "Created session GameSession."
#
# Host ports: game 7807 (udp+tcp), Steam query 27017/udp.
# The built-in HTTP API (8080) and the Takaro plugin/sidecar ports (18890/18891)
# stay inside the container network namespace and are never published.
name: takaro-dev-vein
services:
  vein:
    build: ../images/vein
    image: takaro-dev-vein:latest
    container_name: takaro-dev-vein
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "7807:7777/udp"
      - "7807:7777/tcp"
      - "27017:27015/udp"
    environment:
      TZ: Europe/Brussels
      VEIN_SERVER_NAME: "Takaro Dev Vein"
      VEIN_SERVER_DESCRIPTION: "Takaro connector development rig"
      VEIN_MAXPLAYERS: "8"
      # false: the rig must NOT appear on Ramjet's public server list. Direct
      # connect still works.
      VEIN_PUBLIC: "false"
      # LAN test join password (short on purpose); admin creds stay strong.
      VEIN_SERVER_PASSWORD: "${VEIN_DEV_WORLD_PASSWORD:?required}"
      VEIN_ADMIN_STEAMIDS: "${VEIN_DEV_ADMIN_STEAMIDS:-}"
      VEIN_HTTP_PORT: "8080"
      VEIN_PORT: "7777"
      VEIN_QUERY_PORT: "27015"
      # Version-locked on purpose: the client on the gamer PC must match the
      # server build id, so the rig never updates itself behind our back.
      VEIN_AUTO_UPDATE: "false"
      TAKARO_PLUGIN_TOKEN: "${TAKARO_VEIN_PLUGIN_TOKEN:?required}"
      # Consumed by the entrypoint: LD_PRELOAD on the game binary only, and only
      # when the file exists and is non-empty (an empty preload breaks ld.so).
      TAKARO_PLUGIN_SO: /opt/takaro/libtakaro-vein.so
      # Lane L3b: the plugin grants these SteamID64s admin through
      # AVeinGameSession::SetAdmin (VEIN's AdminSteamIDs is NOT a config property,
      # so VEIN_ADMIN_STEAMIDS above can never open the in-game admin panel).
      TAKARO_ADMIN_STEAMIDS: "${VEIN_DEV_ADMIN_STEAMIDS:-}"
      TAKARO_PLUGIN_DEBUG: "1"
    volumes:
      - ../_data/vein-dev:/home/steam/vein
      # The DIRECTORY is mounted read-only (not the .so itself) so compose still
      # starts before the plugin exists, and so SteamCMD can never touch it.
      - ../_data/vein-plugin:/opt/takaro:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Takaro sidecar (connector bridge). Shares the game container's network
  # namespace so the plugin's loopback-only API (127.0.0.1:18890) and the game's
  # own HTTP API (127.0.0.1:8080) are reachable without publishing either.
  # Behind the `sidecar` profile: the source tree may not exist yet and `up -d`
  # must not try to build it.
  vein-takaro:
    build: "${VEIN_SIDECAR_SRC:-../../games/vein/sidecar}"
    image: takaro-vein-sidecar:dev
    container_name: takaro-dev-vein-sidecar
    restart: unless-stopped
    network_mode: "service:vein"
    depends_on:
      - vein
    profiles: ["sidecar"]
    environment:
      TAKARO_WS_URL: "${TAKARO_WS_URL:-wss://connect.takaro.io/}"
      TAKARO_IDENTITY_TOKEN: "${TAKARO_IDENTITY_VEIN:-takaro-dev-vein}"
      TAKARO_REGISTRATION_TOKEN: "${TAKARO_REGISTRATION_TOKEN:?required}"
      TAKARO_SERVER_NAME: "Takaro Dev Vein"
      TAKARO_PLUGIN_URL: "http://127.0.0.1:18890"
      TAKARO_PLUGIN_TOKEN: "${TAKARO_VEIN_PLUGIN_TOKEN:?required}"
      VEIN_LOG_FILE: /home/steam/vein/Vein/Saved/Logs/Vein.log
      VEIN_HTTP_API: "http://127.0.0.1:8080"
      TAKARO_CURSOR_FILE: /data/event-cursor.json
      SIDECAR_HEALTH_PORT: "18891"
      # Self-recovery watchdog. The sidecar shares the game container's network
      # namespace, so a `docker compose up`/recreate of `vein` leaves it holding a
      # dead namespace. It exits after this long with BOTH the plugin and the
      # game's own :8080 API unreachable, and `restart: unless-stopped` above
      # brings it back in the new namespace.
      SIDECAR_EXIT_AFTER_UNREACHABLE_MS: "${VEIN_SIDECAR_EXIT_AFTER_UNREACHABLE_MS:-45000}"
      # Plugin gone but the game still answering = a plugin-only problem; much
      # longer, so a slow server start never restart-loops the sidecar.
      SIDECAR_EXIT_AFTER_PLUGIN_LOSS_MS: "${VEIN_SIDECAR_EXIT_AFTER_PLUGIN_LOSS_MS:-180000}"
      DEBUG: "1"
    volumes:
      - ../_data/vein-dev:/home/steam/vein:ro
      - ../_data/vein-sidecar:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
