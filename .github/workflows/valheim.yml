name: Valheim Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/valheim/**'
      - 'catalog/valheim/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/valheim.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/valheim/**'
      - 'catalog/valheim/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/valheim.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 1.0.1)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. valheim-v3.0.4)
        required: true
        type: string

concurrency:
  group: valheim-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/valheim
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: 8.0.x
      # The C# suite shells out to both bash harnesses
      # (tests/setup-environment-behavior.sh and tests/release-package-behavior.sh), and
      # those need these tools.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq unzip zip
      - name: Restore
        run: dotnet restore mod/Takaro.Valheim.sln
      - name: Test reference-free connector projects
        run: dotnet test mod/Takaro.Valheim.sln --no-restore -v minimal

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh valheim >> "$GITHUB_OUTPUT"

  release:
    needs: [test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: valheim
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The build compiles against the reference assemblies of the pinned depot
      # manifests, which is what a hosted runner can do. Booting the 2 GB Valheim
      # dedicated server and proving the plugin on it is the runtime-CI child issue;
      # this release therefore claims contract verification only.
      runtime: false
