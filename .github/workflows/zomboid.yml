name: Project Zomboid Connector

on:
  push:
    branches: [main]
    paths: ['games/zomboid/**', 'scripts/**', '.github/workflows/zomboid.yml']
  pull_request:
    paths: ['games/zomboid/**', 'scripts/**', '.github/workflows/zomboid.yml']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 1.0.1)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. zomboid-v1.0.1)
        required: true
        type: string

# Serialize same-ref runs so consecutive main pushes don't race on the rolling
# zomboid-dev release. Release runs (caller's workflow name) are in a different group.
concurrency:
  group: zomboid-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A release or recovery run builds the tag, never whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      # The tag, the version, the manifest and the checked-out commit must all agree
      # before anything is built.
      - name: Release guard
        run: scripts/release-guard.sh zomboid "${{ inputs.version }}" "${{ inputs.tag }}"

      # All release/comment operations act as takaro-ci-bot[bot] (not github-actions[bot]).
      # Skipped on fork PRs, which can't access the App secrets and don't publish builds.
      - name: Generate token
        id: app-token
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}

      # PZ B42 ships Zulu OpenJDK 25 and projectzomboid.jar is class-file v69,
      # which a JDK 21 javac cannot read. core targets bytecode 21, agent 25.
      - name: Set up Java 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # The agent compiles against the game jar. Cache the staged jar keyed on
      # the pinned build sha so a clean runner need not re-download it each time.
      - name: Cache Project Zomboid server jar
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: games/zomboid/_deps/projectzomboid.jar
          key: zomboid-gamejar-80e405a4-v1

      - name: Make scripts executable
        run: chmod +x games/zomboid/scripts/*.sh scripts/*.sh

      - name: Stage Project Zomboid server jar
        run: games/zomboid/scripts/setup-environment.sh

      - name: Build agent (unit tests + shadowJar)
        run: |
          cd games/zomboid/mod
          ./gradlew test :agent:shadowJar --no-daemon

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh zomboid >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: games/zomboid/scripts/build-release.sh "${{ steps.params.outputs.version }}" "$RUNNER_TEMP/dist"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      # One publisher for every connector: the set is assembled, published and read
      # back from GitHub. `--mode legacy` means the files are named here rather than
      # derived from a catalog, so this connector's asset names are unchanged.
      # Fork PRs get a read-only token, so they build for validation only.
      - name: Publish
        if: ${{ steps.params.outputs.publish != 'none' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          scripts/publish-release.sh publish \
            --connector zomboid \
            --channel "${{ steps.params.outputs.publish }}" \
            --version "${{ steps.params.outputs.version }}" \
            --tag "${{ steps.params.outputs.tag }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --mode legacy \
            --dist "$RUNNER_TEMP/dist" \
            --out "$RUNNER_TEMP/assembled" \
            -- \
            "$RUNNER_TEMP"/dist/*.jar

      - name: Comment PR build
        if: ${{ steps.params.outputs.publish == 'pr' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/comment-pr-build.sh zomboid \
            "${{ github.event.pull_request.number }}" \
            "${{ steps.params.outputs.tag }}" \
            "${{ steps.params.outputs.version }}" \
            "$RUNNER_TEMP/assembled"
