name: Enshrouded Plugin

on:
  push:
    branches: [main]
    paths: ['games/enshrouded/**', 'scripts/**', '.github/workflows/enshrouded.yml']
  pull_request:
    paths: ['games/enshrouded/**', 'scripts/**', '.github/workflows/enshrouded.yml']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 0.4.2)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. enshrouded-v0.4.2)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/enshrouded/sidecar/package-lock.json
      - name: Install sidecar dependencies
        working-directory: games/enshrouded/sidecar
        run: npm ci
      - name: Typecheck sidecar
        working-directory: games/enshrouded/sidecar
        run: npm run typecheck
      - name: Test sidecar
        working-directory: games/enshrouded/sidecar
        run: npm test
      - name: Plugin host tests
        run: |
          chmod +x games/enshrouded/mod/tests/run.sh
          games/enshrouded/mod/tests/run.sh

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Generate token
        id: app-token
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/enshrouded/sidecar/package-lock.json

      - name: Install zig 0.13.0
        env:
          ZIG_URL: https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          ZIG_SHA256: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
        run: |
          set -euo pipefail
          curl -fsSL "$ZIG_URL" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          "$RUNNER_TEMP/zig/zig" version

      - name: Make scripts executable
        run: chmod +x games/enshrouded/scripts/*.sh games/enshrouded/mod/*.sh scripts/*.sh

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh enshrouded >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        env:
          ZIG: ${{ runner.temp }}/zig/zig
        run: games/enshrouded/scripts/build-release.sh "${{ steps.params.outputs.version }}" "$RUNNER_TEMP/dist"

      - name: Build sidecar release artifact
        run: games/enshrouded/scripts/build-sidecar-release.sh "${{ steps.params.outputs.version }}" "$RUNNER_TEMP/dist"

      - name: Publish stable release assets
        if: ${{ steps.params.outputs.publish == 'stable' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/publish-release.sh upload "${{ steps.params.outputs.tag }}" "$RUNNER_TEMP/dist/takaro-enshrouded-plugin.zip" "$RUNNER_TEMP/dist/takaro-enshrouded-sidecar.zip"

      - name: Publish rolling dev build
        if: ${{ steps.params.outputs.publish == 'rolling' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/publish-release.sh rolling enshrouded-dev \
            "Enshrouded Plugin - latest dev build" \
            "Rolling development build (\`${{ steps.params.outputs.version }}\`), updated on every push to main. Not for production." \
            "$RUNNER_TEMP/dist/takaro-enshrouded-plugin.zip" \
            "$RUNNER_TEMP/dist/takaro-enshrouded-sidecar.zip"

      - name: Publish PR build
        if: ${{ steps.params.outputs.publish == 'pr' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/publish-release.sh rolling "${{ steps.params.outputs.tag }}" \
            "Enshrouded Plugin - build for PR #${{ github.event.pull_request.number }}" \
            "Disposable build (\`${{ steps.params.outputs.version }}\`) for PR #${{ github.event.pull_request.number }}. Replaced on every push, deleted when the PR closes. Not for production." \
            "$RUNNER_TEMP/dist/takaro-enshrouded-plugin.zip" \
            "$RUNNER_TEMP/dist/takaro-enshrouded-sidecar.zip"

      - name: Comment PR build
        if: ${{ steps.params.outputs.publish == 'pr' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/comment-pr-build.sh enshrouded \
            "${{ github.event.pull_request.number }}" \
            "${{ steps.params.outputs.tag }}" \
            "${{ steps.params.outputs.version }}" \
            "$RUNNER_TEMP/dist/takaro-enshrouded-plugin.zip" \
            "$RUNNER_TEMP/dist/takaro-enshrouded-sidecar.zip"
