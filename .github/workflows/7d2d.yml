name: 7D2D Connector

on:
  push:
    branches: [main]
    paths: ['games/7d2d/**', 'tests/test_7d2d_connector_regressions.py', 'scripts/**', '.github/workflows/7d2d.yml']
  pull_request:
    paths: ['games/7d2d/**', 'tests/test_7d2d_connector_regressions.py', 'scripts/**', '.github/workflows/7d2d.yml']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 1.0.1)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. zomboid-v1.0.1)
        required: true
        type: string

# Serialize same-ref runs so consecutive main pushes don't race on the rolling
# 7d2d-dev release. Release runs (caller's workflow name) are in a different group.
concurrency:
  group: 7d2d-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  codestyle:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/7d2d/mod
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      - name: Install CSharpier
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier --check . ../tests

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A release or recovery run builds the tag, never whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      # The tag, the version, the manifest and the checked-out commit must all agree
      # before anything is built.
      - name: Release guard
        run: scripts/release-guard.sh 7d2d "${{ inputs.version }}" "${{ inputs.tag }}"

      # All release/comment operations act as takaro-ci-bot[bot] (not github-actions[bot]).
      # Skipped on fork PRs, which can't access the App secrets and don't publish builds.
      - name: Generate token
        id: app-token
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}

      - name: Cache 7D2D managed DLLs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: binaries-cache
        with:
          path: games/7d2d/_data/7dtd-binaries
          key: 7d2d-managed-v3-2-0-b24994542-v1

      - name: Make scripts executable
        run: chmod +x games/7d2d/scripts/*.sh scripts/*.sh

      - name: Set up environment
        run: games/7d2d/scripts/setup-environment.sh

      - name: Run Generic Connector contract harness
        run: games/7d2d/scripts/test-contract.sh

      - name: Run source regressions
        run: python3 -m unittest tests/test_7d2d_connector_regressions.py

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh 7d2d >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: games/7d2d/scripts/build-release.sh "${{ steps.params.outputs.version }}" "$RUNNER_TEMP/dist"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      # One publisher for every connector: the set is assembled, published and read
      # back from GitHub. `--mode legacy` means the files are named here rather than
      # derived from a catalog, so this connector's asset names are unchanged.
      # Fork PRs get a read-only token, so they build for validation only.
      - name: Publish
        if: ${{ steps.params.outputs.publish != 'none' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          scripts/publish-release.sh publish \
            --connector 7d2d \
            --channel "${{ steps.params.outputs.publish }}" \
            --version "${{ steps.params.outputs.version }}" \
            --tag "${{ steps.params.outputs.tag }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --mode legacy \
            --dist "$RUNNER_TEMP/dist" \
            --out "$RUNNER_TEMP/assembled" \
            -- \
            "$RUNNER_TEMP/dist/takaro-7d2d-mod.zip"

      - name: Comment PR build
        if: ${{ steps.params.outputs.publish == 'pr' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/comment-pr-build.sh 7d2d \
            "${{ github.event.pull_request.number }}" \
            "${{ steps.params.outputs.tag }}" \
            "${{ steps.params.outputs.version }}" \
            "$RUNNER_TEMP/assembled"
