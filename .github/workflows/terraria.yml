name: Terraria Plugin

on:
  push:
    branches: [main]
    paths: ['games/terraria/**', 'scripts/**', '.github/workflows/terraria.yml']
  pull_request:
    paths: ['games/terraria/**', 'scripts/**', '.github/workflows/terraria.yml']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 1.0.1)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. zomboid-v1.0.1)
        required: true
        type: string

concurrency:
  group: terraria-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  bridge-test:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/terraria/bridge
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/terraria/bridge/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A release or recovery run builds the tag, never whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      # The tag, the version, the manifest and the checked-out commit must all agree
      # before anything is built.
      - name: Release guard
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
        run: scripts/release-guard.sh terraria "$IN_VERSION" "$IN_TAG"

      - name: Generate token
        id: app-token
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/terraria/bridge/package-lock.json

      - name: Make scripts executable
        run: chmod +x games/terraria/scripts/*.sh scripts/*.sh

      - name: Set up TShock references
        run: games/terraria/scripts/setup-environment.sh

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh terraria >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: games/terraria/scripts/build-release.sh "${{ steps.params.outputs.version }}" "$RUNNER_TEMP/dist"

      - name: Build bridge release artifact
        run: games/terraria/scripts/build-bridge-release.sh "${{ steps.params.outputs.version }}" "$RUNNER_TEMP/dist"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      # One publisher for every connector: the set is assembled, published and read
      # back from GitHub. `--mode legacy` means the files are named here rather than
      # derived from a catalog, so this connector's asset names are unchanged.
      # Fork PRs get a read-only token, so they build for validation only.
      - name: Publish
        if: ${{ steps.params.outputs.publish != 'none' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          scripts/publish-release.sh publish \
            --connector terraria \
            --channel "${{ steps.params.outputs.publish }}" \
            --version "${{ steps.params.outputs.version }}" \
            --tag "${{ steps.params.outputs.tag }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --mode legacy \
            --dist "$RUNNER_TEMP/dist" \
            --out "$RUNNER_TEMP/assembled" \
            -- \
            "$RUNNER_TEMP/dist/takaro-terraria-plugin.zip" \
            "$RUNNER_TEMP/dist/takaro-terraria-bridge.zip"

      - name: Comment PR build
        if: ${{ steps.params.outputs.publish == 'pr' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/comment-pr-build.sh terraria \
            "${{ github.event.pull_request.number }}" \
            "${{ steps.params.outputs.tag }}" \
            "${{ steps.params.outputs.version }}" \
            "$RUNNER_TEMP/assembled"
