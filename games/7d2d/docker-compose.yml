---
name: takaro-7d2d

# The server files are NOT downloaded here: `takaro-maint steam references` fetches exactly
# the assemblies the mod compiles against from the pinned depot manifests, into
# _data/7dtd-binaries/<fingerprint>. SEVEND2D_FP16 comes from
# `takaro-maint targets resolve --game 7d2d --format env --prefix SEVEND2D`, which
# scripts/lib-target.sh exports for every script here.

services:
  # Compiles the mod against one target's reference assemblies.
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    volumes:
      - ./:/app
      - ./_data/7dtd-binaries/${SEVEND2D_FP16:?run scripts/setup-environment.sh first}:/app/_data/7dtd-binaries
      - ./_data/build:/app/bin
      - ./_data/lib:/app/lib
      # Read-only, for scripts/lib/package.sh: the release zip is packaged in here because
      # the host has no zip and the bytes must not depend on who built them.
      - ../..:/repo:ro
    command: ["bash", "-c", "echo 'Builder container ready' && tail -f /dev/null"]

  # Fetches and builds the pinned third-party dependencies, verifying every download
  # against the sha256 the catalog records.
  deps:
    build:
      context: .
      dockerfile: Dockerfile.builder
    environment:
      SEVEND2D_FINGERPRINT: "${SEVEND2D_FINGERPRINT:?run scripts/setup-environment.sh first}"
      SEVEND2D_DEP_WEBSOCKET_SHARP_URL: "${SEVEND2D_DEP_WEBSOCKET_SHARP_URL:?}"
      SEVEND2D_DEP_WEBSOCKET_SHARP_SHA256: "${SEVEND2D_DEP_WEBSOCKET_SHARP_SHA256:?}"
      SEVEND2D_DEP_LITEDB_URL: "${SEVEND2D_DEP_LITEDB_URL:?}"
      SEVEND2D_DEP_LITEDB_SHA256: "${SEVEND2D_DEP_LITEDB_SHA256:?}"
      SEVEND2D_DEP_SYSTEM_BUFFERS_URL: "${SEVEND2D_DEP_SYSTEM_BUFFERS_URL:?}"
      SEVEND2D_DEP_SYSTEM_BUFFERS_SHA256: "${SEVEND2D_DEP_SYSTEM_BUFFERS_SHA256:?}"
    volumes:
      - ./_data/7dtd-binaries/${SEVEND2D_FP16:?run scripts/setup-environment.sh first}:/binaries
      - ./_data/lib:/app/lib
      - ./scripts:/scripts:ro
    command: ["bash", "/scripts/fetch-deps.sh"]
