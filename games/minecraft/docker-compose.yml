# Test-bot only. The Minecraft dev servers (paper / neoforge / fabric) now live
# in the shared rig: dev-servers/compose/minecraft.yml (`just dev-up minecraft-paper`).
#
# The Mineflayer bot has no rig equivalent yet, so it is kept here. It joins the
# rig servers over the host, hence network_mode: host.
services:
  bot:
    build: ./bot
    container_name: minecraft-bot
    network_mode: host
    environment:
      BOT_SERVERS: "paper:127.0.0.1:25565,neoforge:127.0.0.1:25566,fabric:127.0.0.1:25567"
      BOT_USERNAME: "TakaroBot"
      BOT_API_PORT: "3001"
    restart: unless-stopped
